    }

    .cell.open {

    }

    .cell.bomb {
        background-color: #f10041; /* цвет для клеток с бомбой */
    }

    .cell.neighboring-bomb {
        background-color: #ffd600; /* цвет для клеток с соседней бомбой */
    }

     position: absolute;

</style>

        <li> snake</li>
    </a></div>
 {% endblock %}
<div class="untitled-page root">
    <div class="snow-container"></div>
    <div class="backfeater">
<!--        <div class="text">Игра Сапёр</div>-->
<!--        <h1>Игра Сапёр</h1>-->
        <div id="game"></div>
        <button class="submit1  modal-add" id="restart-button">Заново</button>
    </div>
</div>
<script>
    document.getElementById('restart-button').addEventListener('click', function () {
        location.reload(); // Обновляет страницу
    });

    const rows = 10; // количество строк
    const cols = 10; // количество колонок
    const totalBombs = 10; // количество бомб
    const gameArea = document.getElementById("game");
    let cells = [];

    // Создание игрового поля
    function createGameBoard() {
        for (let r = 0; r < rows; r++) {
            cells[r] = [];
            for (let c = 0; c < cols; c++) {
                cells[r][c] = {isBomb: false, opened: false, neighboringBombs: 0};
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.addEventListener("click", () => handleCellClick(r, c, cell));
                gameArea.appendChild(cell);
                cells[r][c].element = cell; // сохраняем элемент для дальнейшей работы
            }
        }
        placeBombs();
        calculateNeighboringBombs();
    }

    // Размещение бомб
    function placeBombs() {
        let bombsPlaced = 0;
        while (bombsPlaced < totalBombs) {
            const r = Math.floor(Math.random() * rows);
            const c = Math.floor(Math.random() * cols);
            if (!cells[r][c].isBomb) {
                cells[r][c].isBomb = true;
                bombsPlaced++;
            }
        }
    }

    // Расчет соседних бомб
    function calculateNeighboringBombs() {
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let bombCount = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue; // пропускаем саму клетку
                        const newRow = r + i;
                        const newCol = c + j;
                        if (isInBounds(newRow, newCol) && cells[newRow][newCol].isBomb) {
                            bombCount++;
                        }
                    }
                }
                cells[r][c].neighboringBombs = bombCount;
            }
        }
    }

    // Обработка клика по клетке
    function handleCellClick(row, col, cell) {
        if (cells[row][col].opened) return; // выходим, если клетка уже открыта
        cells[row][col].opened = true;
        cell.classList.add("open");

        if (cells[row][col].isBomb) {
            cell.classList.add("bomb");
            alert("Игра окончена! Вы попали на мину!");
        } else {
            if (cells[row][col].neighboringBombs > 0) {
                // Если есть соседние мины, окрашиваем в желтый
                cell.style.backgroundColor = "#ffd600";
                cell.innerText = cells[row][col].neighboringBombs; // показываем количество соседних бомб
            }
        }
    }

    // Проверка на выход за границы
    function isInBounds(row, col) {
        return row >= 0 && row < rows && col >= 0 && col < cols;
    }

    // Запуск игры
    createGameBoard();
</script>

{% endblock %}
