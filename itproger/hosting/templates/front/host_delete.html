{% extends 'front/layout.html' %}
{% load static %}
{% block title%}Del_host{% endblock %}

{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'front/css/scan.css' %}"/>
<div class="untitled-page root">
    <div class="backfeater" style="color:#FFFFFF">
        <h4>Delete host permanently!</h4>
        <p>This action is permanent.</p>
        <form method="post">
            {% csrf_token %}<br>
            <button class="btn btn-success" type="submit">Delete host</button>

        </form>
        <div id="modal-container"></div>
    </div>
</div>


{% endblock %}
