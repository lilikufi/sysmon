{% extends 'front/layout.html' %}
{% load static %}
{% block title %}Scan{% endblock %}
{% block search %}
{% endblock %}
{% block content %}

<link rel="stylesheet" type="text/css" href="{% static 'front/css/map.css' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'front/css/leaflet.css' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'front/css/create-form.css' %}"/>
<script src="{% static 'front/js/create.js' %}"></script>
<script src="{% static 'front/js/leaflet.js' %}"></script>
<script src="{% static 'front/js/d3.v6.min.js' %}"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-editable@1.2.0/dist/leaflet-editable.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet-editable@1.2.0/dist/leaflet-editable.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Kolomna Map</title>
<style>
    .pin_host {
        left: 55px;
        top: 10px;
        position: absolute; /* or fixed, depending on the task */
        z-index: 9999; /* Set a high value so the element is above everything */
    }

    .route {
        left: 190px;
        top: 10px;
        position: absolute; /* or fixed, depending on the task */
        z-index: 9999; /* Set a high value so the element is above everything */
    }
    .custom-marker {
    text-align: center; /* Center text */
}

.marker-label {
   font-size: 12px;
  color: #000;
  margin-top: 5px;
  white-space: nowrap;
  background: #ffffffa3;
  width: fit-content;
  border-radius: 20px;
  padding: 0 10px;
      backdrop-filter: blur(10px);
}
</style>
<div class="untitled-page root">

    <div class="backfeater">
        <button id="pin_host" class="submit1 modal-button pin_host " type="submit">Pin host</button>
        <button id="route" class="submit1 modal-button route " type="submit">Route</button>

        <div class="modal" id="line-settings-form" style="display: none;">
            <form id="line-settings" method="post" action="{% url 'save_line_settings' %}">
                {% csrf_token %}
                <input type="hidden" name="line_id" value="line1"> <!-- Add line_id if needed -->
                <label for="line-color">Line color:</label>
                <input class="form-control" type="color" id="line-color" name="color" value="#569fee">
                <br>
                <label for="line-weight">Line weight:</label>
                <input class="form-control ip-read" type="number" id="line-weight" name="weight" value="2" min="1"
                       max="10">
                <br>
                <label for="line-type">Line type:</label>
                <select class="form-control" id="line-type" name="line_type">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="dotted">Dotted</option>
                    <option value="dash-dot">Dash-dot</option>
                </select>
                <br>
                <button class="submit1 modal-button save" type="submit">Save</button>
                <button class="modal-button back" type="button" onclick="window.location.href='{% url 'map' %}'">Cancel</button>
            </form>
        </div>
        <div id="tree-container">
            <div id="map">

            </div>

        </div>
    </div>
</div>
<script>

// Map initialization
var map = L.map('map', {
    minZoom: 3, // Minimum zoom level (zoom out)
    maxZoom: 16  // Maximum zoom level (zoom in)
}).setView([55.07, 38.80], 14); // Kolomna district center

// Add the base map layer (OpenStreetMap)
L.tileLayer('/static/front/tiles/{z}/{x}/{y}.png', {
    // attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Load the GeoJSON file
// fetch("{% static 'front/data/kolomna.geojson' %}")
//     .then(response => response.json())
//     .then(data => {
//         L.geoJSON(data).addTo(map);
//     });

// Load existing hosts onto the map
var hosts = JSON.parse('{{ hosts|escapejs }}');
var markers = {}; // Dictionary for storing markers
let isRouteModeActive = false; // Flag for enabling route mode
let parentHost = null; // Parent host
let childHost = null; // Child host
let waypoints = []; // Route waypoints
let polyline = null; // Route line

// Handler for the "Route" button
document.getElementById('route').addEventListener('click', function (e) {
    e.preventDefault();
    isRouteModeActive = true; // Enable route mode
    parentHost = null; // Reset parent host
    childHost = null; // Reset child host
    waypoints = []; // Clear waypoints
    alert('Route mode enabled. Select the parent host.');
});

// Host marker click handler
map.on('click', function (e) {
    // alert("isRouteModeActive", $isRouteModeActive)
    console.log(isRouteModeActive);
    if (isRouteModeActive) {
        // Check whether a host marker was clicked
        const marker = e.layer;
        if (marker && marker instanceof L.Marker) {
            console.log("true1")

            const hostIp = Object.keys(markers).find(key => markers[key] === marker);

            if (!parentHost) {
                parentHost = hostIp; // Set parent host
                alert('Parent host selected. Now select the child host.');
            } else if (!childHost) {
                childHost = hostIp; // Set child host
                alert('Child host selected. Now add waypoints by clicking the map.');
            }
        } else if (parentHost && childHost) {
            console.log("error")
            // Add waypoint
            waypoints.push(e.latlng);
            updateRoute(); // Update route
        }
    }
});

// Function for updating the route
function updateRoute() {
    if (polyline) {
        map.removeLayer(polyline); // Remove the old route line
    }

    // Create route point array
    const routePoints = [markers[parentHost].getLatLng(), ...waypoints, markers[childHost].getLatLng()];

    // Draw the new route line
    polyline = L.polyline(routePoints, {
        color: '#569fee',
        weight: 4,
        opacity: 0.7
    }).addTo(map);
}

// Function for saving the route
function saveRoute() {
    if (parentHost && childHost) {
        const routeData = {
            parent: parentHost,
            child: childHost,
            waypoints: waypoints.map(point => [point.lat, point.lng])
        };

        // Send data to the server
        fetch("{% url 'save_route' %}", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(routeData)
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Route saved successfully.');
                } else {
                    alert('Error saving route.');
                }
            });
    } else {
        alert('You must select parent and child hosts.');
    }
}

// Add a button for saving the route
const saveRouteButton = L.Control.extend({
    options: {
        position: 'topright'
    },
    onAdd: function (map) {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        const button = L.DomUtil.create('button', '', container);
        button.innerHTML = 'Save route';
        button.onclick = saveRoute;
        return container;
    }
});

map.addControl(new saveRouteButton());
hosts.forEach(function (host) {
    if (host.latitude && host.longitude) {
        // Determine marker color
        var iconColor = host.status_color || '#14FF47FF'; // Green by default

        // Text under the icon (IP or host name)
        var labelText = host.hostname || host.ipaddr; // Use the host name if available; otherwise use IP

        // Create a custom icon with text under the image
        var icon = L.divIcon({
            className: 'custom-marker', // Class for styling
            html: `
<div class="marker-icon" style="background-image: url('/static/front/img/server-1.png');"></div>
<div class="marker-shadow" style="background-color: ${iconColor};"></div>
<div class="marker-label">${labelText}</div>
`,
            iconSize: [25, 41], // Icon size
            iconAnchor: [12, 41], // Icon anchor point
            popupAnchor: [1, -34] // Popup anchor point
        });

        // Create a marker with a custom icon
        var marker = L.marker([host.latitude, host.longitude], {
            draggable: true, // Allow marker dragging
            icon: icon,
        }).addTo(map);

        // Save the marker to the dictionary
        markers[host.ipaddr] = marker;

        // Marker move handler
        marker.on('dragend', function (e) {
            var coords = marker.getLatLng();
            updateHostCoordinates(host.ipaddr, [coords.lat, coords.lng]);
        });

        // Add a popup with host information
        marker.bindPopup(
            'IP address: ' + host.ipaddr +
            '<br>Status: ' + host.status +
            '<br>Name: ' + host.hostname +
            '<br>Section: ' + host.section +
            '<br><button id="pingButton_' + host.ipaddr + '" class="pingButton">Ping</button>' +
            '<br><button id="delButton_' + host.ipaddr + '" class="delButton">Remove from map</button>'
        );

        // Handler for the "Ping" button
        marker.on('popupopen', function () {
            document.getElementById('pingButton_' + host.ipaddr).onclick = function () {
                alert('Starting ping for ' + host.ipaddr + '...');

                fetch(`/ping/${host.ipaddr}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        alert('Ping result:\n' + data.output);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while running ping.');
                    });
            };
        });

        // Handler for the "Remove from map" button
        marker.on('popupopen', function () {
            document.getElementById('delButton_' + host.ipaddr).onclick = function () {
                alert('Resetting host parameters ' + host.ipaddr + '...');

                fetch(`/del_coord/${host.ipaddr}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({ action: 'reset' })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Host parameters reset successfully.');
                            window.location.reload();
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while resetting host parameters.');
                    });
            };
        });
    }
});;

// Add lines between parents and children
hosts.forEach(function (host) {
    if (host.parent && markers[host.parent] && markers[host.ipaddr]) {
        var parentCoords = markers[host.parent].getLatLng();
        var childCoords = markers[host.ipaddr].getLatLng();

        // Create a unique line ID from IP addresses
        var lineId = host.parent + '-' + host.ipaddr;

        // Get saved settings if they exist
        var savedLineSettings = JSON.parse(localStorage.getItem(lineId)) || {
            color: '#569fee', // Default color
            weight: 6, // Default weight
            line_type: 'solid' // Default line type
        };

        // Function for converting line type to dashArray
        function getDashArray(lineType) {
            switch (lineType) {
                case 'solid':
                    return null; // Solid line
                case 'dashed':
                    return '10,10'; // Dashed
                case 'dotted':
                    return '2,6'; // Dotted
                case 'dash-dot':
                    return '10,6,2,6'; // Dash-dot
                default:
                    return null;
            }
        }

        // Create a line with saved settings
        var polyline = L.polyline([parentCoords, childCoords], {
            color: savedLineSettings.color, // Use saved color
            weight: savedLineSettings.weight, // Use saved weight
            dashArray: getDashArray(savedLineSettings.line_type), // Apply line type
            opacity: 0.5 // Line opacity
        }).addTo(map);

        // Add a click handler for resizing the line
        polyline.on('click', function () {
            // Show the form
            document.getElementById('line-settings-form').style.display = 'block';

            // Fill the form with current values
            document.getElementById('line-color').value = savedLineSettings.color;
            document.getElementById('line-weight').value = savedLineSettings.weight;
            document.getElementById('line-type').value = savedLineSettings.line_type;

            // Form submit handler
            document.getElementById('line-settings').onsubmit = function (event) {
                event.preventDefault();

                // Get new values from the form
                var newColor = document.getElementById('line-color').value;
                var newWeight = parseInt(document.getElementById('line-weight').value);
                var newLineType = document.getElementById('line-type').value;

                // Update line style
                polyline.setStyle({
                    color: newColor,
                    weight: newWeight,
                    dashArray: getDashArray(newLineType) // Apply the new line type
                });

                // Save new values to localStorage
                savedLineSettings.color = newColor;
                savedLineSettings.weight = newWeight;
                savedLineSettings.line_type = newLineType;
                localStorage.setItem(lineId, JSON.stringify(savedLineSettings));


                // Hide the form
                document.getElementById('line-settings-form').style.display = 'none';

                // Send data to the server through AJAX
                $.ajax({
                    url: '/save_line_settings/', // URL for saving line settings
                    method: 'POST',
                    data: {
                        line_id: lineId,
                        color: newColor,
                        weight: newWeight,
                        line_type: newLineType, // Send line type
                        csrfmiddlewaretoken: '{{ csrf_token }}' // CSRF token for Django
                    },
                    success: function (response) {
                        console.log('Line settings saved on the server');
                    },
                    error: function (error) {
                        console.error('Error saving line settings:', error);
                    }
                });
            };
        });
    }
});

// Handle map clicks
let isAddHostActive = false; // Flag for tracking add-host mode activity

// Handler for the "Pin host" button
document.getElementById('pin_host').addEventListener('click', function (e) {
    e.preventDefault(); // Prevent default button behavior if this is a form
    isAddHostActive = true; // Activate add-host mode
    console.log('Add-host mode activated');
});

// Map click handler
map.on('click', function (e) {
    if (isAddHostActive) { // Check whether add-host mode is active
        var coords = e.latlng;
        var ipaddr = prompt("Enter host IP address:", "192.0.2.1"); // IP address prompt
        if (ipaddr) {
            addHost(coords, ipaddr, map); // Add host
        }
        isAddHostActive = false; // Deactivate the mode after adding the host
        console.log('Add-host mode deactivated');
    }
});

// Function for adding a host
function addHost(coords, ipaddr, map) {
    // AJAX request for saving the host on the server
    fetch("{% url 'add_host_map' %}", {
        method: "POST",
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken') // Get CSRF token
        },
        body: new URLSearchParams({
            'ip_address': ipaddr,
            'latitude': coords.lat,
            'longitude': coords.lng
        })
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {

                var marker = L.marker([coords.lat, coords.lng], {
                    draggable: true, // Allow marker dragging
                    icon: L.icon({
                        // iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                        iconUrl: '/static/front/img/server-1.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41], // Icon size
                        iconAnchor: [12, 41], // Icon anchor point
                        popupAnchor: [1, -34] // Popup anchor point
                    })
                }).addTo(map);

                // Marker move handler
                marker.on('dragend', function (e) {
                    var coords = marker.getLatLng();
                    updateHostCoordinates(ipaddr, [coords.lat, coords.lng]);
                });

                // Add a popup with host information
                marker.bindPopup('IP address: ' + ipaddr + '<br>Status: New<br>Section: Not specified');

                console.log('Added host with IP: ' + ipaddr + ' at coordinates: ', coords);
            } else {
                alert('Error adding host');
            }
        });
}

// Function for updating host coordinates
function updateHostCoordinates(ipaddr, coords) {
    fetch("{% url 'update_host_coordinates' %}", {
        method: "POST",
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken') // Get CSRF token
        },
        body: new URLSearchParams({
            'ip_address': ipaddr,
            'latitude': coords[0],
            'longitude': coords[1]
        })
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                console.log('Host coordinates updated:', ipaddr, coords);
            } else {
                alert('Error updating host coordinates');
            }
        });
}

// Function for getting CSRF token
function getCookie(name) {
    const cookieValue = document.cookie.split('; ').find(row => row.startsWith(name + '='));
    return cookieValue ? cookieValue.split('=')[1] : null;
}


</script>
{% endblock %}
