<script>
    const data = {{ tree|safe }};

    function buildHierarchy(data) {
        const map = {};
        data.forEach(item => map[item.ipaddr] = item);
        data.forEach(item => {
            if (item.children.length) {
                item.children = item.children.map(childIp => map[childIp]);
            }
        });
        return data[0];
    }

    const treeData = buildHierarchy(data);
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#tree-container").append("svg")
        .attr("width", width)
        .attr("height", height)
        .call(d3.zoom().on("zoom", function (event) {
            g.attr("transform", event.transform);
        }));

    const g = svg.append("g")
        .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

    const root = d3.hierarchy(treeData);
    const radius = Math.min(width, height) / 2 - 50;
    const treeLayout = d3.tree().size([360, radius]);

    treeLayout(root);

    g.selectAll('.link')
        .data(root.links())
        .enter()
        .append('path')
        .attr('class', 'link')
        .attr('d', d3.linkRadial()
            .angle(d => d.x * (Math.PI / 180))
            .radius(d => d.y +50))
        .style('fill', 'none')
        .style('stroke', 'rgba(255,255,255,0.09)')
        .style('stroke-width', 2);

    const node = g.selectAll('.node')
        .data(root.descendants())
        .enter()
        .append('g')
        .attr('class', 'node')
        .attr('transform', d => `rotate(${d.x - 90}) translate(${d.y + 50},0)`);

    // node.append('circle')
    //     .attr('r', 5)
    //     .style('fill', '#69b3a2')
    //     .style('fill', d => d.data.status ? 'rgb(20 255 71)' : 'rgb(255 20 96)');
    node.append('circle')
        .attr('r', 5)
        .style('fill', '#69b3a2')
        .style('fill', d => {
            if (  d.data.status_serv === 'ok'){
                return 'rgb(20 255 71)';
        }
            else if (d.data.status_serv === 'critical' && d.data.status === true ){
                return 'rgb(255,110,20)';
        }
           else if (d.data.status === false){
                return 'rgb(255 20 96)';
        }else if (d.data.ipaddr ==='sysmon'){
                return 'rgb(20 255 71)';
        }
        });
    node.append('text')
        .style('fill', 'white')
        .attr('dy', '.35em')
        .attr('x', 10)
        // .attr('transform', d => d.x <180 ? null : 'rotate(180)')
        .attr('transform', d => {
            if (d.x >= 0 && d.x < 20){
                return 'rotate(80)';
            }else if (d.x >= 20 && d.x < 50){
                return 'rotate(60)';
            }else if (d.x >= 50 && d.x < 90){
                return 'rotate(50)';
            }else if (d.x >= 90 && d.x < 110){
                return 'rotate(-20)';
            }else if (d.x >= 110 && d.x < 130){
                return 'rotate(-20)';
            }else if (d.x >= 130 && d.x < 180){
                return 'rotate(300)';
            }else if (d.x >= 180 && d.x < 200){
                return 'rotate(265)';
            }else if (d.x >= 200 && d.x < 250){
                return 'rotate(220)';
            }else if (d.x >= 250 && d.x < 300){
                return 'rotate(190)';
            }else if (d.x >= 340 && d.x < 350){
                return 'rotate(110)';
            }else if (d.x >= 350 && d.x < 360){
                return 'rotate(120)';
            }else{
                return 'rotate(150)';
            }


        })
        // .attr('transform', d => 'rotate(0)')
        // .attr('x', 10) // Text position to the right of nodes
        // .attr('x', d => d.x <180 ? 10 : -10)
        // .style('text-anchor', d => d.x <180 ? 'start': 'end') // Always start with text on the left
        .text(d => d.data.ipaddr)
        .on('click', function(event, d) {
            alert('start ping');
            const hostName = d.data.name;
            fetch(`/ping/${d.data.ipaddr}/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Ping output:', data.output);
                alert(data.output);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
</script>

<script>
    // Handler for the "Route" button
document.getElementById('route').addEventListener('click', function (e) {
    e.preventDefault();
    isRouteModeActive = true; // Enable route mode
    parentHost = null; // Reset parent host
    childHost = null; // Reset child host
    waypoints = []; // Clear waypoints
    alert('Route mode enabled. Select the parent host.');
});

// Add a click handler to each marker
hosts.forEach(function (host) {
    if (host.latitude && host.longitude) {
        var iconColor = host.status_color || '#14FF47FF'; // Green by default

        var icon = L.divIcon({
            className: 'custom-marker',
            html: `
                <div class="marker-icon" style="background-image: url('/static/front/img/server-1.png');"></div>
                <div class="marker-shadow" style="background-color: ${iconColor};"></div>
            `,
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });

        var marker = L.marker([host.latitude, host.longitude], {
            draggable: true,
            icon: icon,
        }).addTo(map);

        markers[host.ipaddr] = marker;

        // Marker click handler
        marker.on('click', function (e) {
            if (isRouteModeActive) {
                const hostIp = Object.keys(markers).find(key => markers[key] === marker);

                if (!parentHost) {
                    parentHost = hostIp; // Set parent host
                    alert('Parent host selected. Now select the child host.');
                } else if (!childHost) {
                    childHost = hostIp; // Set child host
                    alert('Child host selected. Now add waypoints by clicking the map.');
                }
            }
        });

        // Marker move handler
        marker.on('dragend', function (e) {
            var coords = marker.getLatLng();
            updateHostCoordinates(host.ipaddr, [coords.lat, coords.lng]);
        });

        // Add a popup with host information
        marker.bindPopup(
            'IP address: ' + host.ipaddr +
            '<br>Status: ' + host.status +
            '<br>Name: ' + host.hostname +
            '<br>Section: ' + host.section +
            '<br><button id="pingButton_' + host.ipaddr + '" class="pingButton">Ping</button>'
        );

        // Handler for the ping button
        marker.on('popupopen', function () {
            document.getElementById('pingButton_' + host.ipaddr).onclick = function () {
                alert('Starting ping for ' + host.ipaddr + '...');

                fetch(`/ping/${host.ipaddr}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        alert('Ping result:\n' + data.output);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while running ping.');
                    });
            };
        });
    }
});

// Map click handler for adding waypoints
map.on('click', function (e) {
    if (isRouteModeActive && parentHost && childHost) {
        // Add waypoint
        waypoints.push(e.latlng);
        updateRoute(); // Update route
    }
});
</script>
