name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - run: python itproger/manage.py check
      - run: python itproger/manage.py makemigrations --check --dry-run
      - run: python itproger/manage.py test accounts hosting
      - run: ruff check itproger
